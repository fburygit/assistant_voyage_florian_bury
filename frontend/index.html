<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant de Voyage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuration initiale de Tailwind pour le Dark Mode
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

    <header class="bg-blue-600 dark:bg-blue-800 text-white py-6 shadow-md mb-8">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">🌍 Assistant Planificateur de Voyage</h1>
            <div class="flex items-center gap-4">
                <button id="btn-dark" onclick="toggleDarkMode()" class="bg-blue-500 dark:bg-blue-700 hover:bg-blue-400 dark:hover:bg-blue-600 px-3 py-2 rounded text-sm transition" title="Changer de mode">🌙 Mode Sombre</button>
                <button id="btn-logout" class="hidden bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-semibold transition" onclick="logout()">Se déconnecter</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-4xl">
        
        <div id="section-auth" class="grid md:grid-cols-2 gap-8">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-lg shadow-sm border border-slate-100 dark:border-slate-700">
                <h2 class="text-xl font-bold mb-4 text-blue-600 dark:text-blue-400">📝 S'inscrire (Sign Up)</h2>
                <form id="form-signup" onsubmit="handleSignup(event)" class="space-y-3">
                    <div><label class="block text-sm font-medium mb-1">Prénom</label><input type="text" id="sign-prenom" required class="w-full border dark:border-slate-600 rounded p-2 text-sm focus:outline-blue-500 dark:bg-slate-700"></div>
                    <div><label class="block text-sm font-medium mb-1">Nom</label><input type="text" id="sign-nom" required class="w-full border dark:border-slate-600 rounded p-2 text-sm focus:outline-blue-500 dark:bg-slate-700"></div>
                    <div><label class="block text-sm font-medium mb-1">Date de naissance</label><input type="date" id="sign-date" required class="w-full border dark:border-slate-600 rounded p-2 text-sm focus:outline-blue-500 dark:bg-slate-700"></div>
                    <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" id="sign-email" required class="w-full border dark:border-slate-600 rounded p-2 text-sm focus:outline-blue-500 dark:bg-slate-700"></div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-1">Mot de passe</label>
                        <input type="password" id="sign-pass" oninput="checkPasswordStrength()" required class="w-full border dark:border-slate-600 rounded p-2 text-sm focus:outline-blue-500 dark:bg-slate-700">
                        <div class="mt-2 h-1.5 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                            <div id="strength-bar" class="h-full w-0 bg-red-500 transition-all duration-300"></div>
                        </div>
                        <span id="strength-text" class="text-xs font-semibold text-slate-400 mt-1 block">Entrez un mot de passe</span>
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded text-sm transition mt-4">Créer mon compte</button>
                </form>
            </div>

            <div class="bg-white dark:bg-slate-800 p-6 rounded-lg shadow-sm border border-slate-100 dark:border-slate-700 h-fit">
                <h2 class="text-xl font-bold mb-4 text-emerald-600 dark:text-emerald-400">🔐 Se connecter (Login)</h2>
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3">
                    <div><label class="block text-sm font-medium mb-1">Email</label><input type="email" id="login-email" required class="w-full border dark:border-slate-600 rounded p-2 text-sm focus:outline-emerald-500 dark:bg-slate-700"></div>
                    <div><label class="block text-sm font-medium mb-1">Mot de passe</label><input type="password" id="login-pass" required class="w-full border dark:border-slate-600 rounded p-2 text-sm focus:outline-emerald-500 dark:bg-slate-700"></div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-sm transition">Connexion</button>
                </form>
            </div>
        </div>

        <div id="section-app" class="hidden space-y-6">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-lg shadow-sm border border-slate-100 dark:border-slate-700 max-w-xl mx-auto space-y-4">
                <h2 class="text-xl font-bold text-indigo-600 dark:text-indigo-400 text-center">🎯 Planifier une escapade</h2>
                
                <form onsubmit="handlePlan(event)" class="flex gap-2">
                    <input type="text" id="plan-city" placeholder="Ex: Orléans, Paris, Londres, Tokyo..." required class="flex-1 border dark:border-slate-600 rounded p-3 focus:outline-indigo-500 font-medium dark:bg-slate-700">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 rounded transition">Rechercher</button>
                    <button type="button" onclick="searchRandomCity()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 rounded transition" title="Destination aléatoire">🎲</button>
                </form>

                <div id="history-container" class="hidden text-sm">
                    <span class="text-slate-500 dark:text-slate-400 font-medium">Récemment cherché :</span>
                    <div id="history-list" class="inline-flex flex-wrap gap-1 ml-2"></div>
                </div>
            </div>

            <div id="result-container" class="hidden bg-white dark:bg-slate-800 p-6 rounded-lg shadow-md border border-slate-100 dark:border-slate-700 max-w-2xl mx-auto space-y-6">
                <div class="flex items-center justify-between border-b dark:border-slate-700 pb-4">
                    <h3 class="text-2xl font-bold text-slate-800 dark:text-white" id="res-ville">Orléans</h3>
                    
                    <div class="flex items-center gap-4">
                        <span id="res-custom-icon" class="text-4xl filter drop-shadow">☀️</span>
                        <div class="text-right">
                            <span class="text-3xl font-extrabold text-orange-500 block" id="res-temp">17°C</span>
                            <span class="text-sm font-medium text-slate-500 dark:text-slate-400 capitalize" id="res-desc">couvert</span>
                        </div>
                    </div>
                </div>
                <div>
                    <h4 class="text-md font-bold text-indigo-600 dark:text-indigo-400 mb-3 uppercase tracking-wider">🌟 3 Activités recommandées (BDD MySQL) :</h4>
                    <ul id="res-activites" class="space-y-2"></ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let searchHistory = []; 

        // PISTE 1 : Gestion du Mode Sombre
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('btn-dark').innerText = isDark ? "☀️ Mode Clair" : "🌙 Mode Sombre";
        }

        // PISTE 8 : Algorithme visuel pour la force du mot de passe
        function checkPasswordStrength() {
            const pass = document.getElementById('sign-pass').value;
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            
            if (pass.length === 0) {
                bar.style.width = '0%';
                text.innerText = "Entrez un mot de passe";
                text.className = "text-xs font-semibold text-slate-400 mt-1 block";
            } else if (pass.length < 6) {
                bar.style.width = '30%';
                bar.className = "h-full bg-red-500 transition-all duration-300";
                text.innerText = "🔴 Trop court (min 6 caractères)";
                text.className = "text-xs font-semibold text-red-500 mt-1 block";
            } else if (pass.length < 10 || !/\d/.test(pass)) {
                bar.style.width = '60%';
                bar.className = "h-full bg-orange-500 transition-all duration-300";
                text.innerText = "🟠 Moyen (ajoutez des chiffres ou plus de lettres)";
                text.className = "text-xs font-semibold text-orange-500 mt-1 block";
            } else {
                bar.style.width = '100%';
                bar.className = "h-full bg-emerald-500 transition-all duration-300";
                text.innerText = "🟢 Excellent mot de passe !";
                text.className = "text-xs font-semibold text-emerald-500 mt-1 block";
            }
        }

        // PISTE 3 CORRIGÉE : Dictionnaire d'icônes HD basé sur le code météo d'OpenWeather
        function getCustomWeatherIcon(iconCode) {
            // Les codes officiels OpenWeatherMap mappés vers de superbes illustrations d'emojis HD
            const mapping = {
                "01d": "☀️", "01n": "🌙", // ciel dégagé
                "02d": "⛅", "02n": "☁️", // peu de nuages
                "03d": "☁️", "03n": "☁️", // nuages épars
                "04d": "☁️", "04n": "☁️", // nuages brisés / couvert
                "09d": "🌧️", "09n": "🌧️", // pluie torrentielle
                "10d": "🌦️", "10n": "🌧️", // pluie modérée / légère
                "11d": "⛈️", "11n": "⛈️", // orage
                "13d": "❄️", "13n": "❄️", // neige
                "50d": "🌫️", "50n": "🌫️"  // brouillard
            };
            return mapping[iconCode] || "🌍";
        }

        async function handleSignup(e) {
            e.preventDefault();
            const payload = {
                prenom: document.getElementById('sign-prenom').value,
                nom: document.getElementById('sign-nom').value,
                date_naissance: document.getElementById('sign-date').value,
                email: document.getElementById('sign-email').value,
                password: document.getElementById('sign-pass').value
            };
            try {
                const response = await fetch(`${API_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (response.ok) {
                    alert("🎉 Compte créé avec succès ! Vous pouvez maintenant vous connecter.");
                    document.getElementById('form-signup').reset();
                    checkPasswordStrength(); // Reset la jauge
                } else { alert(`❌ Erreur: ${data.detail}`); }
            } catch (err) { alert("Impossible de joindre l'API"); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('login-email').value);
            formData.append('password', document.getElementById('login-pass').value);

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    showDashboard();
                } else { alert(`❌ Erreur de connexion: ${data.detail}`); }
            } catch (err) { alert("Impossible de joindre l'API"); }
        }

        async function handlePlan(e, cityFromHistory = null) {
            if (e) e.preventDefault();
            const city = cityFromHistory ? cityFromHistory : document.getElementById('plan-city').value.trim();
            const token = localStorage.getItem('token');

            try {
                const response = await fetch(`${API_URL}/plan`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ city: city })
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('res-ville').innerText = data.ville;
                    document.getElementById('res-temp').innerText = data.meteo.temperature;
                    document.getElementById('res-desc').innerText = data.meteo.conditions;
                    
                    // Application de la piste 3 corrigée : Icône HD stylisée
                    if(data.meteo.icone) {
                        document.getElementById('res-custom-icon').innerText = getCustomWeatherIcon(data.meteo.icone);
                    }

                    const listAct = document.getElementById('res-activites');
                    listAct.innerHTML = "";
                    data.activites_recommandees.forEach(act => {
                        listAct.innerHTML += `<li class="bg-slate-50 dark:bg-slate-700 p-3 rounded border border-slate-100 dark:border-slate-600 font-medium flex items-center gap-2">🔹 ${act}</li>`;
                    });
                    document.getElementById('result-container').classList.remove('hidden');
                    updateHistory(data.ville);

                } else { alert(`❌ Erreur: ${data.detail}`); }
            } catch (err) { alert("Session expirée ou erreur serveur."); }
        }

        function searchRandomCity() {
            const villes = ['Paris', 'Orléans', 'Londres', 'Tokyo'];
            const villeAleatoire = villes[Math.floor(Math.random() * villes.length)];
            document.getElementById('plan-city').value = villeAleatoire;
            handlePlan(null);
        }

        function updateHistory(ville) {
            if (!searchHistory.includes(ville)) {
                searchHistory.unshift(ville);
                if(searchHistory.length > 4) searchHistory.pop();
                
                const listJson = document.getElementById('history-list');
                listJson.innerHTML = "";
                searchHistory.forEach(v => {
                    listJson.innerHTML += `<button type="button" onclick="handlePlan(null, '${v}')" class="bg-slate-100 dark:bg-slate-700 hover:bg-indigo-100 dark:hover:bg-indigo-900 hover:text-indigo-600 dark:hover:text-indigo-300 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded text-xs transition font-semibold">${v}</button>`;
                });
                document.getElementById('history-container').classList.remove('hidden');
            }
        }

        function showDashboard() {
            document.getElementById('section-auth').classList.add('hidden');
            document.getElementById('section-app').classList.remove('hidden');
            document.getElementById('btn-logout').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('token');
            document.getElementById('section-auth').classList.remove('hidden');
            document.getElementById('section-app').classList.add('hidden');
            document.getElementById('btn-logout').classList.add('hidden');
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('history-container').classList.add('hidden');
            searchHistory = [];
        }

        if(localStorage.getItem('token')) { showDashboard(); }
    </script>
</body>
</html>
